<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Leaderboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <text y='.9em' font-size='90'>🏆</text></svg>"/>
</head>
<body>
<main class="pub-page">
    <header class="pub-header">
        <div class="pub-header-left" data-lb="flag-display">
            <span class="pub-flag-label">RACE FLAG:</span>
            <div class="pub-flag-box pub-flag-mode" data-lb="flag-mode"></div>
        </div>

        <div class="pub-header-center">
            <h1 class="pub-title">Leaderboard</h1>
            <div class="pub-session" data-lb="session-info">
                <span class="pub-session-label">Current Race Leaderboard:</span>
                <span class="pub-session-id">&nbsp;</span>
            </div>
        </div>

        <div class="pub-header-right" data-lb="timer-display">
            <span class="pub-flag-label">TIME REMAINING:</span>
            <div class="pub-flag-box pub-flag-timer">--:--</div>
        </div>
    </header>
    <section class="pub-content" data-lb="content">
        <p class="pub-idle">Waiting for session data...</p>
    </section>
    <footer class="pub-footer">
        <span data-lb="pub-status" class="pub-conn pub-conn-offline">Offline...</span>
        <button id="pub-fullscreen" class="btn-fullscreen">
            <span>⛶</span>
        </button>
    </footer>
</main>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="../js/main.js"></script>
<script type="module" src="../js/leader-board.js"></script>
</body>
</html>
