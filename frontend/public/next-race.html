<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Next Race</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <text y='.9em' font-size='90'>⏭️</text></svg>"/>
</head>
<body>
<main class="pub-page">
    <header class="pub-header">
        <div class="pub-header-center">
            <h1 class="pub-title">Next Race</h1>
            <div class="pub-session" data-nr="session-info">
                <span class="pub-session-label">Upcoming Session:</span>
                <span class="pub-session-id">iD</span>
            </div>
        </div>
    </header>

    <section class="pub-content" data-nr="content">
        <p class="pub-idle">Waiting for session data...</p>
    </section>

    <footer class="pub-footer">
        <span data-nr="pub-status" class="pub-conn pub-conn-offline">Offline...</span>
        <button id="pub-fullscreen" class="btn-fullscreen">
            <span>⛶</span>
        </button>
    </footer>
</main>
<!-- noinspection HtmlUnknownTarget -->
<script type="module" src="/socket.io/socket.io.js"></script>
<script type="module" src="../js/main.js"></script>
<script type="module" src="../js/next-race.js"></script>
</body>
</html>
